<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Rebrand storage migration. MUST be the first script in <head>, ahead of
         the pre-paint theme read below and ahead of anything in the bundle.

         The rebrand left ~28 storage keys under the previous brand prefix on
         every existing user's device. Renaming the read/write sites alone would
         silently discard them: Gmail would read as unlinked and force
         re-authorization, paid users would paint as unsubscribed, the cookie
         banner would reappear, device IDs would reset. So the keys are copied
         forward once, here, before the first reader runs.

         Prefix-based rather than a fixed list, so the per-user-id families
         (`_sub_status_<uid>`, `_checklist_dismissed_<uid>`, …) come along
         without enumerating them. Full rationale in plans/. -->
    <script>
      (function() {
        var DONE = 'intrack_key_migration_v1';
        try {
          if (localStorage.getItem(DONE)) return;
        } catch (e) {
          // Safari private mode throws on any storage access. Nothing to
          // migrate and nothing to record — never let this take down the page.
          return;
        }
        function migrate(store) {
          try {
            var oldKeys = [];
            for (var i = 0; i < store.length; i++) {
              var k = store.key(i);
              if (k && k.indexOf('dhanrakshak_') === 0) oldKeys.push(k);
            }
            // Collected first, then mutated: writing while iterating reindexes
            // the store and skips entries.
            for (var j = 0; j < oldKeys.length; j++) {
              var oldKey = oldKeys[j];
              var newKey = 'intrack_' + oldKey.slice('dhanrakshak_'.length);
              // A value already written under the new name is newer than the
              // legacy one and always wins.
              if (store.getItem(newKey) === null) {
                store.setItem(newKey, store.getItem(oldKey));
              }
              store.removeItem(oldKey);
            }
          } catch (e) {}
        }
        migrate(localStorage);
        migrate(sessionStorage);
        try { localStorage.setItem(DONE, 'true'); } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Defaults only. Every public route overwrites title/description/canonical
         at runtime via src/utils/seo.ts; this is what a crawler that does not
         execute JavaScript sees, so it describes the product honestly rather
         than claiming "zero manual logs" (manual entry is a free-tier feature)
         or "100% data ownership". -->
    <meta name="description" content="Connect Gmail once and Intrack turns your bank's transaction alert emails into expenses you approve. Read-only access, every Indian bank and UPI app, free 7-day trial." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://www.intrack.co.in/" />

    <!-- Open Graph / Facebook Link Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intrack" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.intrack.co.in/" />
    <meta property="og:title" content="Intrack — Expenses that track themselves" />
    <meta property="og:description" content="Connect Gmail once and Intrack turns your bank's transaction alert emails into expenses you approve. Read-only access, every Indian bank and UPI app, free 7-day trial." />
    <!-- Must be a raster image. This was favicon.svg, and Facebook, WhatsApp,
         LinkedIn and X all refuse SVG — so every shared link rendered with no
         preview image at all. -->
    <meta property="og:image" content="https://www.intrack.co.in/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Intrack" />

    <!-- Twitter Link Previews -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://www.intrack.co.in/" />
    <meta property="twitter:title" content="Intrack — Expenses that track themselves" />
    <meta property="twitter:description" content="Connect Gmail once and Intrack turns your bank's transaction alert emails into expenses you approve. Read-only access, every Indian bank and UPI app, free 7-day trial." />
    <meta property="twitter:image" content="https://www.intrack.co.in/icon-512.png" />

    <title>Intrack — Personal Finance Dashboard</title>
    <!-- Pre-paint theme. MUST stay inline and MUST stay in <head>: anything
         deferred to the bundle paints after first paint and flashes.

         The app is light only (owner decision, 2026-08-25), so there is nothing
         to resolve — the class goes on unconditionally. This used to read a
         stored preference and fall back to the OS; src/utils/theme.ts carries
         the history and is still the source of truth. -->
    <script>
      (function() {
        try {
          document.documentElement.classList.add('light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) { meta.setAttribute('content', '#ffffff'); }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Standard equivalent of the Apple-prefixed tag above. Both are kept:
         older iOS Safari only reads the apple- one, newer browsers warn that
         it is deprecated and want this. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Intrack" />

    <!-- Global resource error handler to prevent White Screen of Death on redeploy/404 assets -->
    <script>
      window.addEventListener('error', function(e) {
        try {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href;
            if (src && (src.indexOf('/assets/') !== -1 || src.indexOf('index-') !== -1)) {
              console.warn('HTML Head: Asset load failed. Checking for reload loop...', src);
              var now = Date.now();
              var lastReload = sessionStorage.getItem('intrack_last_auto_reload');
              if (lastReload && (now - Number(lastReload) < 15000)) {
                console.error('HTML Head: Reload loop suppressed.');
                return;
              }
              sessionStorage.setItem('intrack_last_auto_reload', String(now));
              window.location.reload();
            }
          }
        } catch (err) {}
      }, true); // Use capture phase
    </script>

    <!-- Bulletproof legacy service worker and cache purge (Background only)

         main.tsx waits on window.__intrackPurge before registering the
         service worker. Without that handshake the unregister below — which is
         async — could resolve AFTER registration and tear down the worker that
         had just been installed, leaving the first visit with no cache at all. -->
    <script>
      window.__intrackPurge = Promise.resolve();
      try {
        if (typeof window !== 'undefined') {
          var PURGE_KEY = 'intrack_purge_v4';
          if (!localStorage.getItem(PURGE_KEY)) {
            if ('serviceWorker' in navigator) {
              window.__intrackPurge = navigator.serviceWorker.getRegistrations().then(function(registrations) {
                return Promise.all(registrations.map(function(r) { return r.unregister(); }));
              }).catch(function() {});
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(key) {
                  return caches.delete(key);
                }));
              });
            }
            try {
              localStorage.setItem(PURGE_KEY, 'true');
            } catch (se) {}
            console.log('webapp: Caches and Service Workers successfully purged in background.');
          }
        }
      } catch (e) {
        console.error('webapp: Cache purge failed', e);
      }
    </script>

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..900;1,300..900&family=Plus+Jakarta+Sans:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    
  </head>
  <body>
    <!-- Scroll-reveal elements are opacity:0 until useScrollReveal's
         IntersectionObserver marks them revealed. With scripting off that never
         happens, and most of the landing and About pages would render blank. -->
    <noscript>
      <style>
        [data-reveal] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
