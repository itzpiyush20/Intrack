version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "@eslint/*"
          - "@testing-library/*"
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vitest*"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@eslint/*"
          - "@testing-library/*"
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vitest*"
